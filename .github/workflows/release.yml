name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # Nothing is published unless the suite passes on Linux and on macOS, including
  # under macOS's own bash 3.2, which is what most Mac users run.
  verify:
    name: verify on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verification suite
        run: bash scripts/test.sh
      - name: Verification suite under the system bash (3.2 on macOS)
        if: runner.os == 'macOS'
        env:
          LWW_BASH: /bin/bash
        run: bash scripts/test.sh

  release:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Tag matches the version in the code
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for v in "$(node -p "require('./package.json').version")" \
                   "$(bash install.sh --version)" \
                   "$(node bin/cli.js --version)"; do
            [ "$v" = "$tag" ] || { echo "version $v does not match tag $GITHUB_REF_NAME"; exit 1; }
          done

      - name: Release notes exist
        run: test -f "docs/releases/${GITHUB_REF_NAME}.md"

      - name: Verify before publishing
        run: bash scripts/test.sh

      - name: Build the Obsidian vault zip
        run: bash scripts/make-vault-zip.sh "${GITHUB_REF_NAME#v}"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          body_path: docs/releases/${{ github.ref_name }}.md
